energy_storage:
  eyebrow: "ENERGY STORAGE"
  title: "Energy Storage Systems (ESS)"
  subtitle: "Grid-scale and behind-the-meter battery storage for a renewable-powered grid — sourced, engineered and integrated."
  items:
    - image: "assets/images/ess-battery-modules.jpg"
      title: "Battery Cells & Modules"
      description: "Lithium-ion (LFP/NMC) cells and modules for stationary storage, sourced from qualified global manufacturers with capacity, cycle-life and safety documentation matched to project requirements."
    - image: "assets/images/ess-bms-pcs.jpg"
      title: "BMS & Power Conversion Systems (PCS)"
      description: "Battery management systems and grid-tie inverters/PCS for containerized and cabinet-based ESS, sized for solar+storage, wind+storage and standalone grid-support applications."
    - image: "assets/images/ess-container-integration.jpg"
      title: "Containerized & Cabinet ESS Integration"
      description: "Component-level and turnkey support for containerized BESS builds — thermal management, fire safety systems, enclosure sourcing, and integration with substation and metering equipment."
    - image: "assets/images/ess-renewable-integration.jpg"
      title: "Renewable Integration Engineering Support"
      description: "Technical consultation for solar and wind + storage hybrid projects — sizing, component selection and coordination with EPC teams, drawing on hands-on power electronics experience."

design_services:
  eyebrow: "ENGINEERING SUPPORT"
  title: "Beyond Sourcing — Real Design Support"
  subtitle: "We don't just connect you to parts. Our team works alongside yours on the engineering itself."
  cards:
    - image: "assets/images/design-pcba.jpg"
      title: "PCBA Design Support"
      description: "From schematic capture to layout, we help you design PCBAs that are manufacturable, testable and ready to scale — not just functional on a bench."
    - image: "assets/images/design-review.jpg"
      title: "Design Review"
      description: "A second set of expert eyes before you commit to tooling. We catch signal integrity, thermal and DFM issues while they're still cheap to fix."
    - image: "assets/images/design-aspice.jpg"
      title: "ASPICE Process Alignment"
      description: "For automotive programs, we help align your development process with Automotive SPICE requirements from the start — not as an audit afterthought."

