seo_title: "About | NexBridge Solutions"
seo_description: "The story, focus areas and values behind NexBridge Solutions."

page_header:
  eyebrow: "About"
  title: "Built On Real Industry Experience"
  subtitle: "NexBridge was created to make it easier for Vietnamese companies to find and work with the right global technology partners."

overview:
  small_title: "DESCRIPTION"
  title: "Who We Are"
  paragraphs:
    - "NexBridge connects Vietnamese manufacturers, OEMs and system integrators with global technology partners in semiconductors, energy storage, renewable energy and industrial solutions. We start with the application and its real constraints, not a product catalogue."
    - "Our approach is built on practical experience in Vietnam's automotive, EV, electronics and industrial sectors — so we understand both the engineering requirements and the realities of getting a project built."
  mission_cards:
    - icon: target
      title: "Our Mission"
      description: "Help Vietnamese companies access suitable global technologies and turn them into practical, workable solutions."
    - icon: eye
      title: "Our Vision"
      description: "Become the trusted connection between global technology companies and Vietnamese industry."

focus_areas:
  eyebrow: "OUR FOCUS AREAS"
  title: "Where We Work"
  image: "/assets/images/diagrams/about-focus-areas.svg"
  cards:
    - title: "Semiconductors & Electronic Components"
      description: "For automotive, industrial electronics, embedded systems and power electronics."
    - title: "Energy Storage & Renewable Energy"
      description: "Battery systems, BMS, PCS and container integration for storage and renewable projects."
    - title: "Engineering & Process Solutions"
      description: "Requirements management, traceability, ASPICE and cross-functional workflows."
    - title: "Industrial Technology"
      description: "Automation, materials and technical solutions for manufacturers and integrators."

how_we_work:
  eyebrow: "HOW WE WORK"
  title: "From First Conversation To Working Project"
  image: "/assets/images/diagrams/about-how-we-work.svg"
  steps:
    - title: "Listen"
      description: "Understand the application, the real problem and the technical constraints."
    - title: "Evaluate"
      description: "Review requirements and identify suitable technologies and partners."
    - title: "Connect"
      description: "Bring together the right customer, technology and people."
    - title: "Support"
      description: "Help both sides move from first discussion to a practical, working project."

why_nexbridge:
  eyebrow: "WHY NEXBRIDGE"
  title: "Why Customers Work With Us"
  cards:
    - title: "Practical, Not Theoretical"
      description: "Recommendations come from real experience with engineering teams and complex projects — not a sales pitch."
    - title: "Engineering Before Sales"
      description: "We understand the problem first, and only recommend what is technically suitable and commercially realistic."
    - title: "Local Understanding, Global Reach"
      description: "We know how Vietnamese customers work, and help global partners access this market."
    - title: "Built For The Long Term"
      description: "We aim for relationships that create lasting value, not one-time transactions."

closing:
  title: "Connecting Technology With Opportunity"
  paragraphs:
    - "For Vietnamese companies, NexBridge provides access to technologies, suppliers and expertise that may otherwise be hard to identify or evaluate. For global technology partners, we provide local market understanding and practical support in Vietnam."
    - "NexBridge stands between the two sides — not simply as an intermediary, but as a partner that understands the technology, the market and the work required to bring them together."
