seo_title: "About | NexBridge Technology"
seo_description: "The story, philosophy and values behind NexBridge Technology."

page_header:
  eyebrow: "About"
  title: "Built On Real Engineering Experience"
  subtitle: "Why NexBridge exists, and the philosophy behind how we work with every customer."

overview:
  small_title: "DESCRIPTION"
  title: "Who We Are"
  paragraphs:
    - "NexBridge Technology connects Vietnamese manufacturers, OEMs and system integrators with the right global technology partners — from semiconductor suppliers like TI and NXP to materials specialists like T-Global — to solve real engineering problems."
    - "Rather than pushing products, we start with the problem: understanding the application, the operating conditions and the constraints, then matching it to a component, material or partner that actually fits."
    - "Drawing on hands-on experience from the front lines of Vietnam's electric vehicle industry, we bring practical, application-tested knowledge to every recommendation we make."
  mission_cards:
    - icon: target
      title: "Our Mission"
      description: "To empower Vietnamese industries by connecting them with the right global technologies to solve real engineering problems."
    - icon: eye
      title: "Our Vision"
      description: "To be the most trusted engineering bridge between global technology innovators and Vietnamese industry."
    - icon: compass
      title: "Our Approach"
      description: "Understand – Connect – Integrate – Deliver – Support."
    - icon: commitment
      title: "Our Commitment"
      description: "Integrity, partnership and long-term value creation for our customers and communities."

