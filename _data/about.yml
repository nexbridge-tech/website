philosophy:
  eyebrow: "OUR PHILOSOPHY"
  title: "We Build Value Before We Build Business"
  subtitle: "At NexBridge, success is not measured by the number of products sold, but by the long-term value we create for our customers, partners and the industries we serve."
  cards:
    - title: "Think Long Term"
      description: "Sustainable partnerships always outperform short-term transactions."
    - title: "Engineering Before Sales"
      description: "We seek to understand the problem before recommending any solution."
    - title: "Trust Creates Opportunity"
      description: "Trust is earned through honesty, expertise and consistent delivery."

bridge_way:
  eyebrow: "THE NEXBRIDGE WAY"
  title: "How We Work"
  steps:
    - title: "Listen"
      description: "Understand the customer's business, not just the technical specification."
    - title: "Learn"
      description: "Research technologies, evaluate suppliers and compare approaches."
    - title: "Connect"
      description: "Bring together the right people, the right technologies and the right partners."
    - title: "Create Value"
      description: "Deliver sustainable outcomes that continue long after the project is completed."

values:
  eyebrow: "OUR VALUES"
  title: "What We Believe"
  cards:
    - title: "Integrity"
      description: "Always keep promises and act with honesty, even when it is difficult."
    - title: "Expertise"
      description: "Knowledge comes before products. Every recommendation is based on engineering."
    - title: "Partnership"
      description: "Long-term relationships are more valuable than short-term transactions."
    - title: "Innovation"
      description: "Continuously explore emerging technologies to create future-ready solutions."
