      tag: "Automation"
      title: "Smart Factory Integration"
      description: "Most automation projects don't fail on the hardware — they fail on the gap between the PLC, the network layer and whatever's already running on the floor. We map the full data path first, so the new layer actually talks to the old one."
      link_text: "Discuss A Similar Project →"
      link: "contact.html"
    - image: "assets/images/case-precision-manufacturing.jpg"
      tag: "Semiconductor"
      title: "Precision Manufacturing"
      description: "High-tech production lines need materials qualified for the actual tolerances and conditions on that line — not a datasheet that looks close enough. We work through qualification alongside the customer's process engineers, not around them."
